<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novedades y noticias</title>
<link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="logo-180.png">
<meta name="description" content="Lo más importante del día, por secciones, con enlace a cada fuente.">
<meta property="og:type" content="website">
<meta property="og:title" content="Novedades y noticias">
<meta property="og:description" content="Lo más importante del día, por secciones, con enlace a cada fuente.">
<meta property="og:url" content="https://novedadesynoticias.netlify.app/">
<meta property="og:image" content="https://novedadesynoticias.netlify.app/preview.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://novedadesynoticias.netlify.app/preview.jpg">

<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--lin:#e4e0d6;--ac:#b4372a}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--card:#1f2024;--tx:#ecebe7;--mut:#9b9a95;--lin:#2e2f34;--ac:#e2705f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--lin)}
.top{max-width:1100px;margin:auto;padding:14px 18px 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font:700 28px Newsreader,serif;margin:0}h1 span{color:var(--ac)}
#fecha{color:var(--mut);font-size:14px}
select{margin-left:auto;font:14px Inter;padding:6px 8px;border-radius:8px;border:1px solid var(--lin);background:var(--card);color:var(--tx)}
nav{max-width:1100px;margin:auto;padding:0 18px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav a{white-space:nowrap;font-size:13.5px;color:var(--tx);text-decoration:none;border:1px solid var(--lin);border-radius:999px;padding:4px 12px;background:var(--card)}
nav a:hover{border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:10px 18px 60px}
section{margin-top:28px;scroll-margin-top:120px}
h2{font:700 24px Newsreader,serif;margin:0 0 2px;border-top:3px solid var(--tx);padding-top:8px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--lin);border-radius:12px;padding:14px 16px}
.item h3{font:600 18px/1.3 Newsreader,serif;margin:0 0 6px}
.item h3 a{color:var(--tx);text-decoration:none}.item h3 a:hover{color:var(--ac)}
.item p{margin:0 0 8px;font-size:14.5px}
.meta{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.meta span{flex:1}.btn{margin-left:auto;font:600 13px Inter;color:#fff;background:var(--ac);border-radius:8px;padding:6px 12px;text-decoration:none;white-space:nowrap}.btn:hover{opacity:.85}.meta b{color:var(--ac);font-weight:600}
.vacio{color:var(--mut);font-style:italic;font-size:14px}
#destacado .grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
#destacado .item{border-left:4px solid var(--ac)}
footer{max-width:1100px;margin:auto;padding:20px 18px 40px;color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="top"><h1><img src="logo.svg" alt="" style="width:34px;height:34px;vertical-align:-5px;margin-right:10px">Novedades <span>y</span> noticias</h1><div id="fecha"></div>
<select id="ed" aria-label="Edición"></select></div><nav id="nav"></nav></header>
<main id="main"></main>
<footer>Se actualiza todos los días a las 6 (hora de Argentina). Titulares y resúmenes breves con enlace a cada fuente.</footer>
<script>
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let SEC=[];
async function cargar(f){
  const ed=await (await fetch('datos/ediciones/'+f+'.json',{cache:'no-store'})).json();
  document.getElementById('fecha').textContent=fmt(ed.fecha);
  const nav=[],html=[];
  for(const s of SEC){
    const it=(ed.secciones||{})[s.id]||[];
    nav.push(`<a href="#${s.id}">${esc(s.titulo)}</a>`);
    html.push(`<section id="${s.id}"><h2>${esc(s.titulo)}</h2>${s.sub?`<div class="sub">${esc(s.sub)}</div>`:''}`+
      (it.length?`<div class="grid">${it.map(n=>`<article class="item"><h3><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a></h3><p>${esc(n.resumen)}</p><div class="meta"><span><b>${esc(n.fuente)}</b>${n.fecha?' · '+esc(n.fecha):''}${n.tema?' · '+esc(n.tema):''}</span><a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener">Enlace ↗</a></div></article>`).join('')}</div>`:'<div class="vacio">Sin novedades para esta sección en esta edición.</div>')+'</section>');
  }
  document.getElementById('nav').innerHTML=nav.join('');
  document.getElementById('main').innerHTML=html.join('');
}
(async()=>{
  SEC=await (await fetch('secciones.json',{cache:'no-store'})).json();
  const idx=await (await fetch('datos/indice.json',{cache:'no-store'})).json();
  const sel=document.getElementById('ed');
  sel.innerHTML=idx.ediciones.map(f=>`<option value="${f}">${new Date(f+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})}</option>`).join('');
  sel.onchange=()=>cargar(sel.value);
  if(idx.ediciones.length) cargar(idx.ediciones[0]);
})();
</script></body></html>
